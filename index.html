<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BEGA" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>BEGA - 야구 플랫폼</title>

    <!-- External resource preconnect hints -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://api.begabaseball.xyz">

    <!-- Base font loading (retro fonts are loaded only by retro UI) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">

    <style>
      /* FOUC 방지: 다크모드일 때 CSS 로드 전 즉시 배경색 적용 */
      html.dark body {
        background-color: #000000; /* Tailwind Slate-950 (approx HSL 222 84% 4.9%) */
        color: #f8fafc;
      }
      html.dark {
        background-color: #000000;
      }
    </style>

    <!-- 테마 초기화 스크립트 (FOUC 방지) -->
    <script src="/theme-init.js"></script>

    <!-- SEO_HEAD_SLOT -->
  </head>

  <body>
    <div id="root">
      <!-- SEO_ROOT_SLOT -->
    </div>
    <!-- #root 밖에 위치: React DOM 조정 시 제거되지 않아 0.2s 페이드가 완전히 완료됨 -->
    <div id="app-shell-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background-color:#000000;z-index:9999;transition:opacity 0.2s ease;">
      <div style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.12);border-top-color:#3b82f6;border-radius:50%;animation:shell-spin 0.7s linear infinite;"></div>
    </div>
    <style>@keyframes shell-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
