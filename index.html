<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BEGA" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>BEGA - 야구 플랫폼</title>

    <!-- External resource preconnect hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://api.begabaseball.xyz">

    <!-- Non-blocking font loading (moved from index.css @import to avoid render blocking) -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
          media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    </noscript>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css"
          media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
    </noscript>

    <style>
      /* FOUC 방지: 다크모드일 때 CSS 로드 전 즉시 배경색 적용 */
      html.dark body {
        background-color: #020617; /* Tailwind Slate-950 (approx HSL 222 84% 4.9%) */
        color: #f8fafc;
      }
      html.dark {
        background-color: #020617;
      }
    </style>

    <!-- 테마 초기화 스크립트 (FOUC 방지) -->
    <script>
      (function() {
        const normalizeTheme = (value) => {
          if (typeof value !== 'string') {
            return null;
          }

          const stripQuotes = (raw) => {
            const trimmed = raw.trim();
            if (
              (trimmed.startsWith('"') && trimmed.endsWith('"')) ||
              (trimmed.startsWith("'") && trimmed.endsWith("'"))
            ) {
              return trimmed.slice(1, -1).trim();
            }
            return trimmed;
          };

          const getDirectTheme = (rawValue) => {
            const normalized = stripQuotes(rawValue).toLowerCase();
            if (normalized === 'dark' || normalized === 'light') {
              return normalized;
            }
            return null;
          };

          let normalized = getDirectTheme(value);
          if (normalized) {
            return normalized;
          }

          let candidate = value;
          for (let i = 0; i < 3; i += 1) {
            try {
              const parsed = JSON.parse(candidate);
              if (typeof parsed === 'string') {
                candidate = parsed;
                normalized = getDirectTheme(candidate);
                if (normalized) {
                  return normalized;
                }
                continue;
              }

              if (
                parsed &&
                typeof parsed === 'object' &&
                typeof parsed.theme === 'string'
              ) {
                candidate = parsed.theme;
                normalized = getDirectTheme(candidate);
                if (normalized) {
                  return normalized;
                }
                continue;
              }
            } catch (error) {
              break;
            }
            break;
          }

          return null;
        };

        const storedTheme = normalizeTheme(localStorage.getItem('kbo-theme'));
        const legacyTheme = normalizeTheme(localStorage.getItem('bega-theme'));
        const previousTheme = normalizeTheme(localStorage.getItem('theme'));
        const migrationTheme = legacyTheme || previousTheme;
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        // kbo-theme(신규), bega-theme(구형), theme(구형) 값이 유효한 경우 우선 적용
        const theme = storedTheme || migrationTheme || (systemPrefersDark ? 'dark' : 'light');

        const root = document.documentElement;
        root.classList.remove('light', 'dark');
        root.classList.add(theme);

        // 배경색 즉시 적용으로 깜빡임 최소화
        const bgColor = theme === 'dark' ? '#020617' : '#ffffff';
        if (theme === 'dark') {
          document.body && (document.body.style.backgroundColor = '#020617');
          root.style.backgroundColor = '#020617';
        } else {
          if (document.body) {
            document.body.style.backgroundColor = '#ffffff';
          }
          root.style.backgroundColor = '';
        }

        // 앱 셸 로더 배경색을 테마에 맞게 즉시 업데이트
        var loader = document.getElementById('app-shell-loader');
        if (loader) {
          loader.style.backgroundColor = bgColor;
        }

        // 구형 키의 유효 값이 있으면 신규 키로 정합성 보정 후 정리
        if (!storedTheme && migrationTheme) {
          localStorage.setItem('kbo-theme', migrationTheme);
          localStorage.removeItem('bega-theme');
          localStorage.removeItem('theme');
        } else if (storedTheme && localStorage.getItem('kbo-theme') !== storedTheme) {
          localStorage.setItem('kbo-theme', storedTheme);
        } else if (!storedTheme && !migrationTheme) {
          localStorage.removeItem('kbo-theme');
          localStorage.removeItem('bega-theme');
          localStorage.removeItem('theme');
        }
      })();
    </script>

    <!-- SEO_HEAD_SLOT -->
  </head>

  <body>
    <div id="root">
      <!-- SEO_ROOT_SLOT -->
    </div>
    <!-- #root 밖에 위치: React DOM 조정 시 제거되지 않아 0.2s 페이드가 완전히 완료됨 -->
    <div id="app-shell-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background-color:#020617;z-index:9999;transition:opacity 0.2s ease;">
      <div style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.12);border-top-color:#3b82f6;border-radius:50%;animation:shell-spin 0.7s linear infinite;"></div>
    </div>
    <style>@keyframes shell-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
