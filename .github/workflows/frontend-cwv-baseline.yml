name: Frontend CWV Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  cwv-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load public production env
        shell: bash
        run: |
          if [[ ! -f ".env.production" ]]; then
            echo "Missing .env.production" >&2
            exit 1
          fi
          grep -E '^VITE_SITE_URL=' ".env.production" >> "${GITHUB_ENV}"

      - name: Validate CWV env
        shell: bash
        run: |
          if [[ -z "${VITE_SITE_URL}" ]]; then
            echo "Missing .env.production value: VITE_SITE_URL" >&2
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run CWV baseline report
        run: npm run cwv:baseline

      - name: Publish CWV summary
        if: always()
        shell: bash
        run: |
          echo "### Frontend CWV Baseline" >> "${GITHUB_STEP_SUMMARY}"
          echo "- VITE_SITE_URL: ${VITE_SITE_URL:-<unset>}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ -f "reports/cwv-baseline.md" ]]; then
            cat "reports/cwv-baseline.md" >> "${GITHUB_STEP_SUMMARY}"
          elif [[ -f "reports/cwv-baseline.json" ]]; then
            node - <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
            const fs = require('fs');

            const report = JSON.parse(fs.readFileSync('reports/cwv-baseline.json', 'utf8'));
            const lines = [
              `- Result: ${report.ok ? 'PASS' : 'FAIL'}`,
              `- Site URL: ${report.siteUrl ?? '-'}`,
              `- Timeout: ${report.timeoutMs ?? '-'}ms`,
            ];

            if (report.results?.length) {
              lines.push(
                '',
                '| Route | Strategy | Score | LCP | INP | CLS | Status |',
                '| --- | --- | ---: | --- | --- | --- | --- |',
              );

              for (const result of report.results) {
                lines.push(`| ${result.route} | ${result.strategy} | ${result.performanceScore ?? '-'} | ${result.lcp?.displayValue ?? '-'} | ${result.inp?.displayValue ?? '-'} | ${result.cls?.displayValue ?? '-'} | ${result.status ?? '-'} |`);
              }
            }

            if (report.errorMessage) {
              lines.push('', '**Error**', `- ${report.errorMessage}`);
            }

            if (report.checks?.length) {
              lines.push('', '**Checks**');
              for (const check of report.checks) {
                lines.push(`- ${check}`);
              }
            }

            if (report.warnings?.length) {
              lines.push('', '**Warnings**');
              for (const warning of report.warnings) {
                lines.push(`- ${warning}`);
              }
            }

            console.log(lines.join('\n'));
          NODE
          else
            echo "cwv-baseline reports not found" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload CWV artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-cwv-baseline-artifacts
          path: |
            reports/cwv-baseline.json
            reports/cwv-baseline.md
          if-no-files-found: warn
          retention-days: 14
