name: Frontend Mate Regression Label

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  auto-label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Ensure full mate regression label exists
        uses: actions/github-script@v7
        with:
          script: |
            const label = {
              name: 'full-mate-regression',
              color: 'B60205',
              description: 'Run the full frontend mate regression workflow',
            };

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ...label,
              });
            }

      - name: Checkout base workflow policy
        uses: actions/checkout@v4

      - name: Collect changed files
        id: changed_files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const outputPath = path.join(process.env.RUNNER_TEMP, 'mate-regression-changed-files.txt');
            fs.writeFileSync(outputPath, files.map((file) => file.filename).join('\n') + '\n');
            core.info(`Collected ${files.length} changed files`);
            core.setOutput('path', outputPath);

      - name: Evaluate mate regression label policy
        id: evaluate_label
        shell: bash
        run: |
          set +e
          node scripts/mate-regression-label-check.mjs \
            --json \
            --file "${{ steps.changed_files.outputs.path }}" \
            > "${RUNNER_TEMP}/mate-regression-label-result.json"
          status=$?
          cat "${RUNNER_TEMP}/mate-regression-label-result.json"

          if [[ "${status}" == "0" ]]; then
            echo "should_apply=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${status}" == "2" ]]; then
            echo "should_apply=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          exit "${status}"

      - name: Sync mate regression label
        uses: actions/github-script@v7
        env:
          MATE_LABEL_RESULT_PATH: ${{ runner.temp }}/mate-regression-label-result.json
          MATE_LABEL_SHOULD_APPLY: ${{ steps.evaluate_label.outputs.should_apply }}
        with:
          script: |
            const fs = require('node:fs');
            const result = JSON.parse(fs.readFileSync(process.env.MATE_LABEL_RESULT_PATH, 'utf8'));
            const label = result.label;
            const shouldApply = process.env.MATE_LABEL_SHOULD_APPLY === 'true';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            if (shouldApply) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [label],
              });
              return;
            }

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }
