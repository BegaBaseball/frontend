name: Frontend Mate Regression

on:
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened
    paths:
      # Mate domain files.
      - "src/api/mate*.ts"
      - "src/components/Mate*.tsx"
      - "src/components/mypage/Mate*.tsx"
      - "src/hooks/mate*.ts"
      - "src/hooks/internal/mate*.ts"
      - "src/utils/mateFlowUi.ts"
      - "src/utils/mate*.ts"
      - "src/store/mateStore.ts"
      - "src/types/mate.ts"
      - "cypress/e2e/mate*.cy.ts"
      # Test harness and workflow contract for mate regression.
      - "scripts/mate-ci-summary.mjs"
      - "scripts/test-e2e.mjs"
      - ".github/labeler.yml"
      - ".github/workflows/_frontend-mate-ci.yml"
      - ".github/workflows/frontend-mate-regression-label.yml"
      - ".github/workflows/frontend-mate-regression.yml"
  workflow_dispatch:
    inputs:
      suite_scope:
        description: "Run a single mate regression slice or the full stack"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - route
          - create
          - extended
      upload_visual_artifacts:
        description: "Upload mate-visual screenshots even when the regression succeeds"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: frontend-mate-regression-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mate-regression:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-mate-regression') }}
    uses: ./.github/workflows/_frontend-mate-ci.yml
    permissions:
      contents: read
      issues: write
    with:
      comment_on_pr: true
      mode: regression
      timeout_minutes: 90
      suite_scope: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.suite_scope || 'all' }}
      upload_visual_artifacts: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_visual_artifacts == 'true' }}
      trigger_note: ${{ github.event_name == 'pull_request' && 'PR label `full-mate-regression` + mate-related path changes' || github.event_name == 'workflow_dispatch' && format('manual workflow dispatch (suite_scope={0})', github.event.inputs.suite_scope || 'all') || 'nightly at 03:00 Asia/Seoul (18:00 UTC)' }}
