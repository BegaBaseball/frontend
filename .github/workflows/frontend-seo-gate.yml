name: Frontend SEO Gate

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/frontend-seo-gate.yml"
  workflow_dispatch:

jobs:
  seo-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load public production env
        id: seo-env
        shell: bash
        env:
          IS_FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          VITE_SITE_URL_FALLBACK: ${{ vars.VITE_SITE_URL || secrets.VITE_SITE_URL }}
          VITE_API_BASE_URL_FALLBACK: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
          VITE_MATE_REQUIRE_SOCIAL_VERIFICATION_FALLBACK: ${{ vars.VITE_MATE_REQUIRE_SOCIAL_VERIFICATION || secrets.VITE_MATE_REQUIRE_SOCIAL_VERIFICATION }}
          VITE_GA4_MEASUREMENT_ID_FALLBACK: ${{ vars.VITE_GA4_MEASUREMENT_ID || secrets.VITE_GA4_MEASUREMENT_ID }}
          VITE_GOOGLE_SITE_VERIFICATION_FALLBACK: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION || secrets.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_NAVER_SITE_VERIFICATION_FALLBACK: ${{ vars.VITE_NAVER_SITE_VERIFICATION || secrets.VITE_NAVER_SITE_VERIFICATION }}
        run: |
          read_env_file_value() {
            local var_name="$1"
            if [[ -f ".env.prod.local" ]]; then
              grep -E "^${var_name}=" ".env.prod.local" | tail -n 1 | cut -d= -f2- || true
            fi
          }

          write_env_value() {
            local var_name="$1"
            local var_value="$2"
            if [[ -n "${var_value}" ]]; then
              printf '%s=%s\n' "${var_name}" "${var_value}" >> "${GITHUB_ENV}"
            fi
          }

          site_url="$(read_env_file_value VITE_SITE_URL)"
          api_base_url="$(read_env_file_value VITE_API_BASE_URL)"
          require_social_verification="$(read_env_file_value VITE_MATE_REQUIRE_SOCIAL_VERIFICATION)"
          ga4_measurement_id="$(read_env_file_value VITE_GA4_MEASUREMENT_ID)"
          google_site_verification="$(read_env_file_value VITE_GOOGLE_SITE_VERIFICATION)"
          naver_site_verification="$(read_env_file_value VITE_NAVER_SITE_VERIFICATION)"

          site_url="${site_url:-${VITE_SITE_URL_FALLBACK}}"
          api_base_url="${api_base_url:-${VITE_API_BASE_URL_FALLBACK}}"
          require_social_verification="${require_social_verification:-${VITE_MATE_REQUIRE_SOCIAL_VERIFICATION_FALLBACK}}"
          require_social_verification="${require_social_verification:-false}"
          ga4_measurement_id="${ga4_measurement_id:-${VITE_GA4_MEASUREMENT_ID_FALLBACK}}"
          google_site_verification="${google_site_verification:-${VITE_GOOGLE_SITE_VERIFICATION_FALLBACK}}"
          naver_site_verification="${naver_site_verification:-${VITE_NAVER_SITE_VERIFICATION_FALLBACK}}"

          missing=()
          for var_name in \
            VITE_SITE_URL \
            VITE_API_BASE_URL \
            VITE_MATE_REQUIRE_SOCIAL_VERIFICATION \
            VITE_GA4_MEASUREMENT_ID \
            VITE_GOOGLE_SITE_VERIFICATION \
            VITE_NAVER_SITE_VERIFICATION; do
            case "${var_name}" in
              VITE_SITE_URL) var_value="${site_url}" ;;
              VITE_API_BASE_URL) var_value="${api_base_url}" ;;
              VITE_MATE_REQUIRE_SOCIAL_VERIFICATION) var_value="${require_social_verification}" ;;
              VITE_GA4_MEASUREMENT_ID) var_value="${ga4_measurement_id}" ;;
              VITE_GOOGLE_SITE_VERIFICATION) var_value="${google_site_verification}" ;;
              VITE_NAVER_SITE_VERIFICATION) var_value="${naver_site_verification}" ;;
            esac
            if [[ -z "${var_value}" ]]; then
              missing+=("${var_name}")
            else
              write_env_value "${var_name}" "${var_value}"
            fi
          done

          if [[ "${#missing[@]}" -gt 0 ]]; then
            if [[ "${IS_FORK_PULL_REQUEST}" == "true" ]]; then
              echo "skip_env_gated=true" >> "${GITHUB_OUTPUT}"
              echo "Fork PR cannot access production env via vars/secrets; skipping SEO env-gated steps." >&2
              exit 0
            fi
            echo "Missing production env. Configure GitHub Actions variables or secrets: ${missing[*]}" >&2
            exit 1
          fi

          echo "skip_env_gated=false" >> "${GITHUB_OUTPUT}"

      - name: Explain fork PR SEO skip
        if: steps.seo-env.outputs.skip_env_gated == 'true'
        shell: bash
        run: |
          echo "### Frontend SEO Gate" >> "${GITHUB_STEP_SUMMARY}"
          echo "Skipped env-gated SEO checks because this pull request comes from a fork and production env values are unavailable to pull_request workflows." >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate SEO env
        if: steps.seo-env.outputs.skip_env_gated != 'true'
        shell: bash
        run: |
          if [[ -z "${VITE_SITE_URL}" ]]; then
            echo "Missing production env: VITE_SITE_URL" >&2
            exit 1
          fi
          if [[ -z "${VITE_API_BASE_URL}" ]]; then
            echo "Missing production env: VITE_API_BASE_URL" >&2
            exit 1
          fi
          if [[ "${VITE_MATE_REQUIRE_SOCIAL_VERIFICATION}" != "true" && "${VITE_MATE_REQUIRE_SOCIAL_VERIFICATION}" != "false" ]]; then
            echo "Production env VITE_MATE_REQUIRE_SOCIAL_VERIFICATION must be set to true or false" >&2
            exit 1
          fi
          for var_name in VITE_GA4_MEASUREMENT_ID VITE_GOOGLE_SITE_VERIFICATION VITE_NAVER_SITE_VERIFICATION; do
            if [[ -z "${!var_name}" ]]; then
              echo "Missing production env: ${var_name}" >&2
              exit 1
            fi
          done

      - name: Setup Node.js 22
        if: steps.seo-env.outputs.skip_env_gated != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.seo-env.outputs.skip_env_gated != 'true'
        run: npm ci

      - name: Run Helmet runtime check
        if: steps.seo-env.outputs.skip_env_gated != 'true'
        run: npm run seo:helmet:check

      - name: Run SEO env check
        if: steps.seo-env.outputs.skip_env_gated != 'true'
        run: npm run seo:env:check:strict

      - name: Run SEO gate
        if: steps.seo-env.outputs.skip_env_gated != 'true'
        run: npm run seo:gate

      - name: Run SEO regression tests
        if: steps.seo-env.outputs.skip_env_gated != 'true'
        run: npm run test:seo

      - name: Publish SEO gate summary
        if: always() && steps.seo-env.outputs.skip_env_gated != 'true'
        shell: bash
        run: |
          echo "### Frontend SEO Gate" >> "${GITHUB_STEP_SUMMARY}"
          echo "- VITE_SITE_URL: ${VITE_SITE_URL:-<unset>}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- VITE_API_BASE_URL: ${VITE_API_BASE_URL:-<unset>}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- VITE_MATE_REQUIRE_SOCIAL_VERIFICATION: ${VITE_MATE_REQUIRE_SOCIAL_VERIFICATION:-<unset>}" >> "${GITHUB_STEP_SUMMARY}"
          for var_name in VITE_GA4_MEASUREMENT_ID VITE_GOOGLE_SITE_VERIFICATION VITE_NAVER_SITE_VERIFICATION; do
            if [[ -n "${!var_name:-}" ]]; then
              echo "- ${var_name}: configured" >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "- ${var_name}: <unset>" >> "${GITHUB_STEP_SUMMARY}"
            fi
          done
          if [[ -f "reports/seo-audit-report.json" ]]; then
            node -e 'const fs=require("fs"); const p="reports/seo-audit-report.json"; const r=JSON.parse(fs.readFileSync(p,"utf8")); console.log(`Result: ${r.ok ? "PASS" : "FAIL"}`); if(Array.isArray(r.failures)&&r.failures.length){console.log("Failures:"); for(const f of r.failures){console.log(`- ${f}`);} } if(Array.isArray(r.warnings)&&r.warnings.length){console.log("Warnings:"); for(const w of r.warnings){console.log(`- ${w}`);} }' >> "${GITHUB_STEP_SUMMARY}"
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            cat "reports/seo-audit-report.json" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "seo-audit-report.json not found" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload SEO artifacts
        if: always() && steps.seo-env.outputs.skip_env_gated != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-seo-gate-artifacts
          path: |
            reports/seo-audit-report.json
            dist/robots.txt
            dist/sitemap.xml
            dist/seo-prerender-report.json
          if-no-files-found: warn
          retention-days: 14
