name: Frontend Mate Smoke

on:
  pull_request:
    paths:
      # Mate domain files.
      - "src/api/mate*.ts"
      - "src/components/Mate*.tsx"
      - "src/components/mypage/Mate*.tsx"
      - "src/hooks/mate*.ts"
      - "src/hooks/internal/mate*.ts"
      - "src/store/mateStore.ts"
      - "src/types/mate.ts"
      - "src/utils/mate*.ts"
      - "cypress/e2e/mate*.cy.ts"
      # Shared runtime and route entrypoints that directly affect mate flows.
      - "src/App.tsx"
      - "src/main.tsx"
      - "src/components/Home.tsx"
      - "src/components/LoadingSpinner.tsx"
      - "src/components/ReviewDialog.tsx"
      - "src/components/SeatViewGallery.tsx"
      - "src/components/TeamLogo.tsx"
      - "src/components/VerificationRequiredDialog.tsx"
      - "src/components/common/OptimizedImage.tsx"
      - "src/components/contexts/ConfirmDialogContext.tsx"
      - "src/components/profile/UserProfileModal.tsx"
      - "src/components/ui/**"
      - "src/hooks/useWebSocket.ts"
      - "src/store/authStore.ts"
      - "src/utils/api.ts"
      - "src/utils/errorUtils.ts"
      - "src/utils/loginRedirect.ts"
      - "src/utils/mateFlowUi.ts"
      # Test harness, build tooling, and workflow contract.
      - "cypress.config.ts"
      - "cypress/support/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/cypress-run.mjs"
      - "scripts/mate-ci-summary.mjs"
      - "scripts/test-e2e.mjs"
      - "vite.config.ts"
      - ".github/workflows/_frontend-mate-ci.yml"
      - ".github/workflows/frontend-mate-smoke.yml"
  workflow_dispatch:

concurrency:
  group: frontend-mate-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mate-smoke:
    uses: ./.github/workflows/_frontend-mate-ci.yml
    permissions:
      contents: read
      issues: write
    with:
      comment_on_pr: true
      mode: smoke
      timeout_minutes: 35
      trigger_note: PR path changes and manual workflow dispatch
