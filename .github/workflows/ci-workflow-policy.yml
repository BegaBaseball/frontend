name: CI Workflow Policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/labeler.yml"
      - "scripts/ci-workflow-policy.mjs"
      - "scripts/ci-workflow-policy.test.ts"
      - "scripts/frontend-ui-impact.mjs"
      - "scripts/frontend-ui-impact.test.ts"
      - "docs/core-web-vitals.md"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: ci-workflow-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check CI workflow policy
        run: node scripts/ci-workflow-policy.mjs
