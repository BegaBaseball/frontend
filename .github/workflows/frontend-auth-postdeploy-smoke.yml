name: Frontend Auth Postdeploy Smoke

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Smoke target backend API base URL"
        required: true
        type: string
        default: "https://api.begabaseball.xyz"
      frontend_origin:
        description: "Frontend origin used for Origin/Referer headers"
        required: true
        type: string
        default: "https://www.begabaseball.xyz"
      timeout_ms:
        description: "Request timeout in milliseconds"
        required: true
        type: string
        default: "15000"

permissions:
  contents: read

jobs:
  auth-postdeploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: frontend-auth-postdeploy-smoke-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ inputs.frontend_origin }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow inputs
        shell: bash
        run: |
          set -euo pipefail

          API_BASE_URL="${{ inputs.api_base_url }}"
          FRONTEND_ORIGIN="${{ inputs.frontend_origin }}"
          TIMEOUT_MS="${{ inputs.timeout_ms }}"

          if ! [[ "${API_BASE_URL}" =~ ^https:// ]]; then
            echo "api_base_url must start with https:// : ${API_BASE_URL}" >&2
            exit 1
          fi

          if ! [[ "${FRONTEND_ORIGIN}" =~ ^https:// ]]; then
            echo "frontend_origin must start with https:// : ${FRONTEND_ORIGIN}" >&2
            exit 1
          fi

          if ! [[ "${TIMEOUT_MS}" =~ ^[0-9]+$ ]]; then
            echo "timeout_ms must be an integer: ${TIMEOUT_MS}" >&2
            exit 1
          fi

          if (( TIMEOUT_MS < 1000 || TIMEOUT_MS > 120000 )); then
            echo "timeout_ms out of range (1000~120000): ${TIMEOUT_MS}" >&2
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run auth postdeploy smoke
        run: >
          npm run smoke:auth:public:prod --
          --api-base-url "${{ inputs.api_base_url }}"
          --frontend-origin "${{ inputs.frontend_origin }}"
          --timeout-ms "${{ inputs.timeout_ms }}"

      - name: Publish smoke summary
        if: always()
        shell: bash
        run: |
          echo "### Frontend Auth Postdeploy Smoke" >> "${GITHUB_STEP_SUMMARY}"
          echo "- API base URL: ${{ inputs.api_base_url }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Frontend origin: ${{ inputs.frontend_origin }}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ -f "reports/auth-public-postdeploy-smoke.json" ]]; then
            node -e 'const fs=require("fs"); const p="reports/auth-public-postdeploy-smoke.json"; const r=JSON.parse(fs.readFileSync(p,"utf8")); console.log(`Result: ${r.ok ? "PASS" : "FAIL"}`); if(Array.isArray(r.failures)&&r.failures.length){console.log("Failures:"); for(const f of r.failures){console.log(`- ${f}`);} } if(Array.isArray(r.warnings)&&r.warnings.length){console.log("Warnings:"); for(const w of r.warnings){console.log(`- ${w}`);} }' >> "${GITHUB_STEP_SUMMARY}"
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            cat "reports/auth-public-postdeploy-smoke.json" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "auth-public-postdeploy-smoke.json not found" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-auth-postdeploy-smoke-artifact
          path: reports/auth-public-postdeploy-smoke.json
          if-no-files-found: warn
          retention-days: 14
