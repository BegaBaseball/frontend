name: Frontend Site Audits

on:
  pull_request:
    paths:
      - "src/seo/**"
      - "scripts/seo-*"
      - "scripts/prerender-seo*"
      - "scripts/generate-sitemap.mjs"
      - "scripts/helmet-runtime-check.mjs"
      - "seo-routes.json"
      - "public/robots.txt"
      - "public/_headers"
      - "public/_redirects"
      - "index.html"
      - "vite.config.ts"
      - "src/main.tsx"
      - "src/index.css"
      - "src/components/AppRoutes.tsx"
      - "src/components/RootEntryRoute.tsx"
      - "src/components/lazyRouteLoaders.ts"
      - "src/components/Layout.tsx"
      - "src/components/Navbar*.tsx"
      - "src/components/PublicNavbar*.tsx"
      - "src/components/Landing.tsx"
      - "src/components/Home.tsx"
      - "src/components/home/**"
      - "src/components/Prediction.tsx"
      - "src/components/prediction/**"
      - "src/components/Cheer.tsx"
      - "src/components/Cheer*.tsx"
      - "src/components/cheer/**"
      - "src/components/MatePage.tsx"
      - "src/components/Mate*.tsx"
      - "module-federation.config.ts"
      - "src/vite-env.d.ts"
      - "src/types/module-federation.d.ts"
      - "src/components/moduleFederation/**"
      - "src/utils/coreWebVitalsTelemetry.ts"
      - "src/utils/coreWebVitalsTelemetry.test.ts"
      - "scripts/bundle-guard.mjs"
      - "scripts/dist-assets.mjs"
      - "scripts/cwv-baseline.mjs"
      - "scripts/cwv-baseline.test.mjs"
      - "scripts/cwv-lab-audit.mjs"
      - "scripts/cwv-lab-audit.test.mjs"
      - "scripts/module-federation-config.test.ts"
      - "scripts/module-federation-artifacts-smoke.mjs"
      - "scripts/module-federation-artifacts-smoke.test.mjs"
      - "scripts/module-federation-gate.mjs"
      - "scripts/module-federation-gate.test.mjs"
      - "scripts/module-federation-host-usage.test.mjs"
      - "scripts/module-federation-probe-smoke.mjs"
      - "scripts/module-federation-probe-smoke.test.mjs"
      - "scripts/module-federation-readiness.mjs"
      - "scripts/module-federation-readiness.test.mjs"
      - "scripts/module-federation-remote-smoke.mjs"
      - "scripts/module-federation-remote-smoke.test.mjs"
      - "scripts/module-federation-types.test.mjs"
      - "cypress/e2e/module-federation-probe.cy.ts"
      - "docs/core-web-vitals.md"
      - "docs/module-federation.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/_frontend-node-suite.yml"
      - ".github/workflows/frontend-site-audits.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: "Audit suite to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - seo
          - mf
          - cwv
  schedule:
    - cron: "0 3 * * 1"

jobs:
  seo-gate:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'seo' || github.event.inputs.suite == 'all')) }}
    uses: ./.github/workflows/_frontend-node-suite.yml
    permissions:
      contents: read
    with:
      timeout_minutes: 20
      install_playwright: true
      env_exports: |
        VITE_SITE_URL=${{ vars.VITE_SITE_URL || 'https://www.begabaseball.xyz' }}
        VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.begabaseball.xyz' }}
        VITE_MATE_REQUIRE_SOCIAL_VERIFICATION=${{ vars.VITE_MATE_REQUIRE_SOCIAL_VERIFICATION || 'false' }}
        VITE_GA4_MEASUREMENT_ID=${{ vars.VITE_GA4_MEASUREMENT_ID || 'G-CI00000000' }}
        VITE_GOOGLE_SITE_VERIFICATION=${{ vars.VITE_GOOGLE_SITE_VERIFICATION || 'ciGoogleVerificationToken2026' }}
        VITE_NAVER_SITE_VERIFICATION=${{ vars.VITE_NAVER_SITE_VERIFICATION || 'ciNaverVerificationToken2026' }}
      pre_run_script: |
        if [[ -z "${VITE_SITE_URL}" ]]; then
          echo "Missing repository variable: VITE_SITE_URL" >&2
          echo "Set Settings > Secrets and variables > Actions > Variables > VITE_SITE_URL" >&2
          exit 1
        fi
        if [[ "${VITE_SITE_URL%/}" != "https://www.begabaseball.xyz" ]]; then
          echo "Repository variable VITE_SITE_URL must be https://www.begabaseball.xyz" >&2
          exit 1
        fi
        if [[ -z "${VITE_API_BASE_URL}" ]]; then
          echo "Missing repository variable: VITE_API_BASE_URL" >&2
          echo "Set Settings > Secrets and variables > Actions > Variables > VITE_API_BASE_URL" >&2
          exit 1
        fi
        if [[ "${VITE_API_BASE_URL%/}" != "https://api.begabaseball.xyz" ]]; then
          echo "Repository variable VITE_API_BASE_URL must be https://api.begabaseball.xyz" >&2
          exit 1
        fi
        if [[ "${VITE_MATE_REQUIRE_SOCIAL_VERIFICATION}" != "true" && "${VITE_MATE_REQUIRE_SOCIAL_VERIFICATION}" != "false" ]]; then
          echo "Repository variable VITE_MATE_REQUIRE_SOCIAL_VERIFICATION must be set to true or false" >&2
          exit 1
        fi
        for var_name in VITE_GA4_MEASUREMENT_ID VITE_GOOGLE_SITE_VERIFICATION VITE_NAVER_SITE_VERIFICATION; do
          if [[ -z "${!var_name}" ]]; then
            echo "Missing repository variable: ${var_name}" >&2
            echo "Set Settings > Secrets and variables > Actions > Variables > ${var_name}" >&2
            exit 1
          fi
        done
      run_script: |
        npm run seo:helmet:check
        npm run seo:env:check:strict
        npm run seo:gate
        npm run test:seo
      summary_script: |
        echo "### Frontend SEO Gate" >> "${GITHUB_STEP_SUMMARY}"
        echo "- VITE_SITE_URL: ${VITE_SITE_URL:-<unset>}" >> "${GITHUB_STEP_SUMMARY}"
        echo "- VITE_API_BASE_URL: ${VITE_API_BASE_URL:-<unset>}" >> "${GITHUB_STEP_SUMMARY}"
        echo "- VITE_MATE_REQUIRE_SOCIAL_VERIFICATION: ${VITE_MATE_REQUIRE_SOCIAL_VERIFICATION:-<unset>}" >> "${GITHUB_STEP_SUMMARY}"
        for var_name in VITE_GA4_MEASUREMENT_ID VITE_GOOGLE_SITE_VERIFICATION VITE_NAVER_SITE_VERIFICATION; do
          if [[ -n "${!var_name:-}" ]]; then
            echo "- ${var_name}: configured" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "- ${var_name}: <unset>" >> "${GITHUB_STEP_SUMMARY}"
          fi
        done
        if [[ -f "reports/seo-audit-report.json" ]]; then
          node -e 'const fs=require("fs"); const p="reports/seo-audit-report.json"; const r=JSON.parse(fs.readFileSync(p,"utf8")); console.log(`Result: ${r.ok ? "PASS" : "FAIL"}`); if(Array.isArray(r.failures)&&r.failures.length){console.log("Failures:"); for(const f of r.failures){console.log(`- ${f}`);} } if(Array.isArray(r.warnings)&&r.warnings.length){console.log("Warnings:"); for(const w of r.warnings){console.log(`- ${w}`);} }' >> "${GITHUB_STEP_SUMMARY}"
          echo '```json' >> "${GITHUB_STEP_SUMMARY}"
          cat "reports/seo-audit-report.json" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
        else
          echo "seo-audit-report.json not found" >> "${GITHUB_STEP_SUMMARY}"
        fi
      artifact_name: frontend-seo-gate-artifacts
      artifact_paths: |
        reports/seo-audit-report.json
        dist/robots.txt
        dist/sitemap.xml
        dist/seo-prerender-report.json

  module-federation-build:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'mf' || github.event.inputs.suite == 'all')) }}
    uses: ./.github/workflows/_frontend-node-suite.yml
    permissions:
      contents: read
    with:
      timeout_minutes: 20
      env_exports: |
        VITE_SITE_URL=${{ vars.VITE_SITE_URL || 'https://www.begabaseball.xyz' }}
        VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.begabaseball.xyz' }}
        VITE_MATE_REQUIRE_SOCIAL_VERIFICATION=${{ vars.VITE_MATE_REQUIRE_SOCIAL_VERIFICATION || 'false' }}
        VITE_GA4_MEASUREMENT_ID=${{ vars.VITE_GA4_MEASUREMENT_ID || 'G-CI00000000' }}
        VITE_GOOGLE_SITE_VERIFICATION=${{ vars.VITE_GOOGLE_SITE_VERIFICATION || 'ciGoogleVerificationToken2026' }}
        VITE_NAVER_SITE_VERIFICATION=${{ vars.VITE_NAVER_SITE_VERIFICATION || 'ciNaverVerificationToken2026' }}
        VITE_MF_DESIGN_SYSTEM_ENTRY=${{ vars.VITE_MF_DESIGN_SYSTEM_ENTRY || '' }}
        VITE_MF_DESIGN_SYSTEM_NAME=${{ vars.VITE_MF_DESIGN_SYSTEM_NAME || 'design_system' }}
      run_script: |
        npm run gate:mf
        npm run smoke:mf:probe
        if [[ -n "${VITE_MF_DESIGN_SYSTEM_ENTRY}" ]]; then
          npm run smoke:mf:probe:remote
        fi
      summary_script: |
        echo "### Frontend Module Federation Build" >> "${GITHUB_STEP_SUMMARY}"
        echo "- Commands: \`npm run gate:mf\`, \`npm run smoke:mf:probe\`" >> "${GITHUB_STEP_SUMMARY}"
        if [[ -n "${VITE_MF_DESIGN_SYSTEM_ENTRY}" ]]; then
          echo "- Remote entry configured: yes" >> "${GITHUB_STEP_SUMMARY}"
        else
          echo "- Remote entry configured: no" >> "${GITHUB_STEP_SUMMARY}"
        fi
        echo "- Browser probe smoke: included" >> "${GITHUB_STEP_SUMMARY}"
        if [[ -n "${VITE_MF_DESIGN_SYSTEM_ENTRY}" ]]; then
          echo "- Browser remote probe smoke: included" >> "${GITHUB_STEP_SUMMARY}"
        else
          echo "- Browser remote probe smoke: skipped" >> "${GITHUB_STEP_SUMMARY}"
        fi
        if [[ -f "reports/module-federation-readiness.json" ]]; then
          node - <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('fs');

          const report = JSON.parse(fs.readFileSync('reports/module-federation-readiness.json', 'utf8'));
          console.log(`- Readiness: ${report.status}`);
          console.log(`- Host ready: ${report.hostReady ? 'yes' : 'no'}`);
          console.log(`- Remote configured: ${report.remoteEntryConfigured ? 'yes' : 'no'}`);
          if (Array.isArray(report.blockers) && report.blockers.length > 0) {
            console.log(`- Blockers: ${report.blockers.join(', ')}`);
          }
          NODE
        else
          echo "- Readiness: missing" >> "${GITHUB_STEP_SUMMARY}"
        fi
        if [[ -f "reports/bundle-guard-report.json" ]]; then
          node - <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('fs');

          const report = JSON.parse(fs.readFileSync('reports/bundle-guard-report.json', 'utf8'));
          const mfBudgets = Array.isArray(report.moduleFederationBudgetResults)
            ? report.moduleFederationBudgetResults
            : [];
          console.log(`- Module Federation mode: ${report.isModuleFederationBuild ? 'enabled' : 'disabled'}`);
          console.log(`- MF budgets checked: ${mfBudgets.length}`);
          console.log(`- Failures: ${Array.isArray(report.failures) ? report.failures.length : 0}`);
          NODE
        else
          echo "- Bundle guard report: missing" >> "${GITHUB_STEP_SUMMARY}"
        fi
        if [[ -f "reports/module-federation-artifacts-smoke.json" ]]; then
          node - <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('fs');

          const report = JSON.parse(fs.readFileSync('reports/module-federation-artifacts-smoke.json', 'utf8'));
          console.log(`- Artifact smoke: ${report.ok ? 'PASS' : 'FAIL'}`);
          console.log(`- Artifacts checked: ${report.counts?.checkedArtifacts ?? '-'}`);
          console.log(`- Bootstrap assets: ${report.counts?.bootstrapAssets ?? '-'}`);
          NODE
        else
          echo "- Artifact smoke: missing" >> "${GITHUB_STEP_SUMMARY}"
        fi
        if [[ -f "reports/module-federation-remote-smoke.json" ]]; then
          node - <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('fs');

          const report = JSON.parse(fs.readFileSync('reports/module-federation-remote-smoke.json', 'utf8'));
          console.log(`- Remote smoke: ${report.ok ? 'PASS' : 'FAIL'}`);
          console.log(`- Remote name: ${report.remoteName ?? '-'}`);
          console.log(`- Expected exposes: ${Array.isArray(report.expectedExposes) ? report.expectedExposes.join(', ') : '-'}`);
          if (Array.isArray(report.missingExposes) && report.missingExposes.length > 0) {
            console.log(`- Missing exposes: ${report.missingExposes.join(', ')}`);
          }
          NODE
        else
          echo "- Remote smoke: skipped" >> "${GITHUB_STEP_SUMMARY}"
        fi
      artifact_name: frontend-module-federation-artifacts
      artifact_paths: |
        reports/bundle-guard-report.json
        reports/dist-assets-report.json
        reports/module-federation-readiness.json
        reports/module-federation-artifacts-smoke.json
        reports/module-federation-remote-smoke.json
        cypress/screenshots/module-federation-probe.cy.ts/**
        dist/mf-manifest.json
        dist/mf-stats.json
        dist/remoteEntry.js
        dist/assets/mf-entry-bootstrap-*.js
        dist/begabaseball_frontend/remoteEntry.js
        dist/begabaseball_frontend/mf-manifest.json
        dist/begabaseball_frontend/mf-stats.json

  cwv-lab:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'cwv' || github.event.inputs.suite == 'all')) }}
    uses: ./.github/workflows/_frontend-node-suite.yml
    permissions:
      contents: read
    with:
      timeout_minutes: 20
      install_playwright: true
      env_exports: |
        VITE_SITE_URL=${{ vars.VITE_SITE_URL || 'https://www.begabaseball.xyz' }}
      run_script: |
        npm run gate:cwv:lab
      summary_script: |
        echo "### Frontend CWV Lab" >> "${GITHUB_STEP_SUMMARY}"
        echo "- Mode: production build + local Vite preview" >> "${GITHUB_STEP_SUMMARY}"
        echo "- Field INP proof: not available in lab; use the scheduled/manual CWV baseline job" >> "${GITHUB_STEP_SUMMARY}"
        if [[ -f "reports/cwv-lab-audit.md" ]]; then
          cat "reports/cwv-lab-audit.md" >> "${GITHUB_STEP_SUMMARY}"
        else
          echo "cwv-lab-audit report not found" >> "${GITHUB_STEP_SUMMARY}"
        fi
      artifact_name: frontend-cwv-lab-artifacts
      artifact_paths: |
        reports/cwv-lab-audit.json
        reports/cwv-lab-audit.md
        reports/bundle-guard-report.json
        reports/dist-assets-report.json

  cwv-baseline:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'cwv' || github.event.inputs.suite == 'all')) }}
    uses: ./.github/workflows/_frontend-node-suite.yml
    permissions:
      contents: read
    secrets:
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
    with:
      timeout_minutes: 20
      env_exports: |
        VITE_SITE_URL=${{ vars.VITE_SITE_URL || 'https://www.begabaseball.xyz' }}
      pre_run_script: |
        if [[ -z "${VITE_SITE_URL}" ]]; then
          echo "Missing repository variable: VITE_SITE_URL" >&2
          echo "Set Settings > Secrets and variables > Actions > Variables > VITE_SITE_URL" >&2
          exit 1
        fi
        if [[ "${VITE_SITE_URL%/}" != "https://www.begabaseball.xyz" ]]; then
          echo "Repository variable VITE_SITE_URL must be https://www.begabaseball.xyz" >&2
          exit 1
        fi
      run_script: |
        npm run gate:cwv:baseline
      summary_script: |
        echo "### Frontend CWV Baseline" >> "${GITHUB_STEP_SUMMARY}"
        echo "- VITE_SITE_URL: ${VITE_SITE_URL:-<unset>}" >> "${GITHUB_STEP_SUMMARY}"
        if [[ -f "reports/cwv-baseline.md" ]]; then
          cat "reports/cwv-baseline.md" >> "${GITHUB_STEP_SUMMARY}"
        elif [[ -f "reports/cwv-baseline.json" ]]; then
          node - <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('fs');

          const report = JSON.parse(fs.readFileSync('reports/cwv-baseline.json', 'utf8'));
          const lines = [
            `- Result: ${report.ok ? 'PASS' : 'FAIL'}`,
            `- Site URL: ${report.siteUrl ?? '-'}`,
            `- Timeout: ${report.timeoutMs ?? '-'}ms`,
          ];

          if (report.results?.length) {
            lines.push(
              '',
              '| Route | Strategy | Score | LCP | INP | CLS | Status |',
              '| --- | --- | ---: | --- | --- | --- | --- |',
            );

            for (const result of report.results) {
              lines.push(`| ${result.route} | ${result.strategy} | ${result.performanceScore ?? '-'} | ${result.lcp?.displayValue ?? '-'} | ${result.inp?.displayValue ?? '-'} | ${result.cls?.displayValue ?? '-'} | ${result.status ?? '-'} |`);
            }
          }

          if (report.errorMessage) {
            lines.push('', '**Error**', `- ${report.errorMessage}`);
          }

          if (report.checks?.length) {
            lines.push('', '**Checks**');
            for (const check of report.checks) {
              lines.push(`- ${check}`);
            }
          }

          if (report.warnings?.length) {
            lines.push('', '**Warnings**');
            for (const warning of report.warnings) {
              lines.push(`- ${warning}`);
            }
          }

          console.log(lines.join('\n'));
          NODE
        else
          echo "cwv-baseline reports not found" >> "${GITHUB_STEP_SUMMARY}"
        fi
      artifact_name: frontend-cwv-baseline-artifacts
      artifact_paths: |
        reports/cwv-baseline.json
        reports/cwv-baseline.md
