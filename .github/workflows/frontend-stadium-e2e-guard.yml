name: Frontend Stadium E2E Guard

on:
  pull_request:
    paths:
      - "src/components/StadiumGuide.tsx"
      - "src/hooks/useStadiumGuide.ts"
      - "src/hooks/useKakaoMap.ts"
      - "src/utils/kakaoMap.ts"
      - "src/utils/stadiumGuideUtils.ts"
      - "src/types/stadium.ts"
      - "cypress/e2e/stadium.cy.ts"
      - "cypress/support/**"
      - "cypress.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-stadium-e2e-guard.yml"
  workflow_dispatch:

concurrency:
  group: frontend-stadium-e2e-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stadium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load public map env
        id: map-env
        shell: bash
        env:
          IS_FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          VITE_KAKAO_MAP_KEY_FALLBACK: ${{ vars.VITE_KAKAO_MAP_KEY || secrets.VITE_KAKAO_MAP_KEY }}
          VITE_KAKAO_API_KEY_FALLBACK: ${{ vars.VITE_KAKAO_API_KEY || secrets.VITE_KAKAO_API_KEY }}
        run: |
          map_key="${VITE_KAKAO_MAP_KEY_FALLBACK}"
          api_key="${VITE_KAKAO_API_KEY_FALLBACK}"
          if [[ -f ".env.production" ]]; then
            file_map_key="$(grep -E '^VITE_KAKAO_MAP_KEY=' ".env.production" | tail -n 1 | cut -d= -f2- || true)"
            file_api_key="$(grep -E '^VITE_KAKAO_API_KEY=' ".env.production" | tail -n 1 | cut -d= -f2- || true)"
            map_key="${file_map_key:-${map_key}}"
            api_key="${file_api_key:-${api_key}}"
          fi
          if [[ -z "${map_key}" && -z "${api_key}" ]]; then
            if [[ "${IS_FORK_PULL_REQUEST}" == "true" ]]; then
              echo "skip_env_gated=true" >> "${GITHUB_OUTPUT}"
              echo "Fork PR cannot access map env via vars/secrets; skipping Stadium E2E env-gated steps." >&2
              exit 0
            fi
            echo "Missing map env: configure GitHub Actions variable or secret VITE_KAKAO_MAP_KEY or VITE_KAKAO_API_KEY." >&2
            exit 1
          fi
          if [[ -n "${map_key}" ]]; then
            printf 'VITE_KAKAO_MAP_KEY=%s\n' "${map_key}" >> "${GITHUB_ENV}"
          fi
          if [[ -n "${api_key}" ]]; then
            printf 'VITE_KAKAO_API_KEY=%s\n' "${api_key}" >> "${GITHUB_ENV}"
          fi
          echo "skip_env_gated=false" >> "${GITHUB_OUTPUT}"

      - name: Explain fork PR Stadium skip
        if: steps.map-env.outputs.skip_env_gated == 'true'
        shell: bash
        run: |
          echo "### Frontend Stadium E2E Guard" >> "${GITHUB_STEP_SUMMARY}"
          echo "Skipped env-gated Stadium E2E because this pull request comes from a fork and map env values are unavailable to pull_request workflows." >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate map env
        if: steps.map-env.outputs.skip_env_gated != 'true'
        shell: bash
        run: |
          if [[ -z "${VITE_KAKAO_MAP_KEY}" && -z "${VITE_KAKAO_API_KEY}" ]]; then
            echo "Missing map env: VITE_KAKAO_MAP_KEY or VITE_KAKAO_API_KEY" >&2
            exit 1
          fi

      - name: Setup Node.js 22
        if: steps.map-env.outputs.skip_env_gated != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.map-env.outputs.skip_env_gated != 'true'
        run: npm ci

      - name: Install Cypress binary
        if: steps.map-env.outputs.skip_env_gated != 'true'
        continue-on-error: true
        shell: bash
        run: npm run cy:install

      - name: Run Stadium Cypress spec
        if: steps.map-env.outputs.skip_env_gated != 'true'
        run: npm run test:e2e:rescue -- --spec cypress/e2e/stadium.cy.ts

      - name: Upload Cypress artifacts
        if: always() && steps.map-env.outputs.skip_env_gated != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-stadium-e2e-artifacts
          path: |
            cypress/screenshots/**
            cypress/videos/**
          if-no-files-found: warn
          retention-days: 14
