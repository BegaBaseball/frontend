name: Frontend Stadium E2E Guard

on:
  pull_request:
    paths:
      - "src/components/StadiumGuide.tsx"
      - "src/hooks/useStadiumGuide.ts"
      - "src/hooks/useKakaoMap.ts"
      - "src/utils/kakaoMap.ts"
      - "src/utils/stadiumGuideUtils.ts"
      - "src/types/stadium.ts"
      - "cypress/e2e/stadium.cy.ts"
      - "cypress/support/**"
      - "cypress.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-stadium-e2e-guard.yml"
  workflow_dispatch:

concurrency:
  group: frontend-stadium-e2e-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stadium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress binary
        continue-on-error: true
        shell: bash
        run: npm run cy:install

      - name: Run Stadium Cypress spec
        run: npm run test:e2e:rescue -- --spec cypress/e2e/stadium.cy.ts

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-stadium-e2e-artifacts
          path: |
            cypress/screenshots/**
            cypress/videos/**
          if-no-files-found: warn
          retention-days: 14
